{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sonarr.fullname" . }}
  labels:
    {{- include "sonarr.labels" . | nindent 4 }}
  annotations:
    {{- include "sonarr.commonAnnotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sonarr.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- if has "Ingress" .Values.networkPolicy.policyTypes }}
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8989
  {{- end }}
  {{- if has "Egress" .Values.networkPolicy.policyTypes }}
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS traffic for API calls and updates
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # Allow HTTP traffic for indexers
    - to: []
      ports:
        - protocol: TCP
          port: 80
  {{- end }}
{{- end }}