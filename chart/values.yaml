  # Additional environment variables (optional)
  extraEnv: []
  # - name: EXAMPLE_VAR
  #   value: "example_value"
  
  # Subdomain configuration
  ingress:
    enabled: true
    subdomain: "plex"
    basePath: ""
  
  image:
    repository: ghcr.io/home-operations/plex
    tag: "1.43.0"
    pullPolicy: Always

