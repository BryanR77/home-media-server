# Values for media-stack monolithic chart

# Global settings shared across all applications
global:
  timezone: "UTC"
  
  # Base domain for all subdomains (e.g., media.local)
  # Individual apps will be accessible at: jellyfin.media.local, sonarr.media.local, etc.
  baseDomain: "media.local"
  
  # Single ingress configuration for all apps
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls: []
  
  # GatewayAPI HTTPRoute configuration
  httpRoute:
    enabled: true
    parentRef:
      name: media-gateway
      namespace: default
    annotations: {}

# Shared storage configuration
shared:
  media:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 500Gi
    annotations: {}
    # This PVC will be mounted by all apps with subdirectories:
    # /media/downloads - for SABnzbd downloads and Sonarr/Radarr processing
    # /media/tv - for TV shows (Sonarr -> Jellyfin)
    # /media/movies - for movies (Radarr -> Jellyfin)
    # /media/music - for music (Lidarr -> Jellyfin, if added later)

    # NFS configuration - when enabled, creates a static PersistentVolume backed by NFS.
    # storageClass will be ignored; static binding is used instead.
    nfs:
      enabled: false
      server: ""   # NFS server IP or hostname (e.g. "192.168.1.100")
      path: ""     # Exported NFS path (e.g. "/mnt/media")
      mountOptions:
        - nconnect=8
        - rsize=1048576
        - wsize=1048576
        - hard
        - noatime
  

# Jellyfin - Media Server
jellyfin:
  enabled: true
  
  # Subdomain configuration
  # When at a subdomain (e.g., jellyfin.media.local), this will be empty string
  # This allows apps to serve from the root of their subdomain
  ingress:
    enabled: true
    subdomain: "jellyfin"
    basePath: ""
  
  image:
    repository: jellyfin/jellyfin
    tag: "10.11.8"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    capabilities:
      drop:
        - ALL

  # Init container to create media subdirectories
  initContainer:
    image:
      repository: busybox
      tag: "1.37"
      pullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    
  service:
    annotations: {}
    type: ClusterIP
    port: 8096
    targetPort: 8096
  
  # Hardware acceleration configuration
  hardwareAcceleration:
    # Intel Quick Sync (requires /dev/dri device)
    intelQuickSync:
      enabled: false
      # Device path to mount (typically /dev/dri)
      devicePath: /dev/dri
      # Video group GID for /dev/dri access (typically 44 on most Linux systems, 39 on some)
      # Set to null to auto-detect or override with specific GID
      videoGroupId: 44
      # Optional scheduling controls when Quick Sync is enabled
      # Provide node labels of machines with Intel iGPU (/dev/dri)
      nodeSelector: {}
      # Optional pod tolerations to land on tainted nodes with iGPU
      tolerations: []
      # Optional pod affinity/anti-affinity
      affinity: {}

    # NVIDIA NVENC (requires NVIDIA GPU Operator/device plugin)
    nvidia:
      enabled: false
      # Number of GPUs to request (typically 1)
      gpuLimit: 1
      # GPU resource name (default: nvidia.com/gpu)
      resourceName: nvidia.com/gpu
      # Runtime class name for the NVIDIA container runtime
      runtimeClassName: nvidia
      # Optional scheduling controls when NVIDIA is enabled (usually not required
      # because requesting GPU resources already pins to GPU nodes)
      nodeSelector: {}
      tolerations: []
      affinity: {}

  persistence:
    config:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 2Gi
      existingClaim: ""
      annotations: {}

    media:
      enabled: true
      existingClaim: "shared-media"
      # Mounts the shared media PVC at /media

  resources:
    limits:
      cpu: 4000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  replicaCount: 1
  strategy:
    type: Recreate
  extraVolumes: []
  extraVolumeMounts: []

# Plex - Media Server
plex:
  enabled: true
  
  # Plex claim token for server registration (optional)
  # Get your claim token from: https://www.plex.tv/claim/
  # Token expires after 4 minutes, so use it immediately after generation
  claimToken: ""
  
  # Additional environment variables (optional)
  extraEnv: []
  # - name: EXAMPLE_VAR
  #   value: "example_value"
  
  # Subdomain configuration
  ingress:
    enabled: true
    subdomain: "plex"
    basePath: ""
  
  image:
    repository: ghcr.io/home-operations/plex
    tag: "1.43.2"
    pullPolicy: Always

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    capabilities:
      drop:
        - ALL

  service:
    annotations: {}
    type: ClusterIP
    port: 32400
    targetPort: 32400
  
  # Hardware acceleration configuration
  hardwareAcceleration:
    # Intel Quick Sync (requires /dev/dri device)
    intelQuickSync:
      enabled: false
      # Device path to mount (typically /dev/dri)
      devicePath: /dev/dri
      # Video group GID for /dev/dri access (typically 44 on most Linux systems, 39 on some)
      # Set to null to auto-detect or override with specific GID
      videoGroupId: 44
      # Optional scheduling controls when Quick Sync is enabled
      # Provide node labels of machines with Intel iGPU (/dev/dri)
      nodeSelector: {}
      # Optional pod tolerations to land on tainted nodes with iGPU
      tolerations: []
      # Optional pod affinity/anti-affinity
      affinity: {}

    # NVIDIA NVENC (requires NVIDIA GPU Operator/device plugin)
    nvidia:
      enabled: false
      # Number of GPUs to request (typically 1)
      gpuLimit: 1
      # GPU resource name (default: nvidia.com/gpu)
      resourceName: nvidia.com/gpu
      # Runtime class name for the NVIDIA container runtime
      runtimeClassName: nvidia
      # Optional scheduling controls when NVIDIA is enabled (usually not required
      # because requesting GPU resources already pins to GPU nodes)
      nodeSelector: {}
      tolerations: []
      affinity: {}
      # Security contexts used when NVIDIA is enabled.
      # The NVIDIA container toolkit (libnvidia-container) only mounts
      # /dev/nvidia-caps/ compute capability devices when the container runs as
      # UID 0.  Without those devices, driver >= 515 returns CUDA_ERROR_NO_DEVICE
      # even though /dev/nvidia0 and nvidia-smi are accessible.  These overrides
      # intentionally omit runAsNonRoot / runAsUser so the container starts as
      # root, letting the toolkit set up GPU access before Plex drops privileges
      # via its entrypoint.
      podSecurityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 65534
        fsGroupChangePolicy: "OnRootMismatch"
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

  persistence:
    config:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 5Gi
      existingClaim: ""
      annotations: {}

    media:
      enabled: true
      existingClaim: "shared-media"
      # Mounts the shared media PVC at /data
      # In Plex, add libraries pointing to /data/movies, /data/tv, /data/music

  resources:
    limits:
      cpu: 4000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /identity
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /identity
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /identity
      port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  replicaCount: 1
  strategy:
    type: Recreate
  extraVolumes: []
  extraVolumeMounts: []

