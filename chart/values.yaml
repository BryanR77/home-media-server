# SABnzbd - Download Client
sabnzbd:
  enabled: true
  
  # Subdomain configuration
  ingress:
    enabled: true
    subdomain: "sabnzbd"
    basePath: ""
  
  image:
    repository: ghcr.io/home-operations/sabnzbd
    tag: "4.5.5"
    pullPolicy: Always

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault
    supplementalGroups: []

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  service:
    annotations: {}
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  # Hostname whitelist configuration for SABnzbd security
  hostnameWhitelist: ""
  
  persistence:
    config:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 1Gi
      existingClaim: ""
      
    media:
      enabled: true
      existingClaim: "shared-media"
      # Mounts the shared media PVC at /media
      # SABnzbd will download to /media/downloads

  resources:
    limits:
      cpu: 4000m
      memory: 2Gi
    requests:
      cpu: 2000m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /api?mode=version
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api?mode=version
      port: http
      scheme: HTTP
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /api?mode=version
      port: http
      scheme: HTTP
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 30

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  replicaCount: 1
  strategy:
     type: Recreate
     rollingUpdate: null
  extraVolumes: []
  extraVolumeMounts: []

