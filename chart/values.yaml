# Tdarr - Automated media transcoding server
tdarr:
  enabled: false

  # Subdomain configuration
  ingress:
    enabled: true
    subdomain: "tdarr"

  image:
    repository: haveagitgat/tdarr
    tag: "2.75.01"
    pullPolicy: IfNotPresent

  # User/group IDs for file ownership (passed as PUID/PGID to the container)
  puid: "65534"
  pgid: "65534"

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: false
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  service:
    annotations: {}
    type: ClusterIP
    # Web UI port
    webUIPort: 8265
    # Node communication port (used by tdarrNode workers)
    serverPort: 8266

  # Set to "true" to also run a transcoding worker inside the server pod.
  # Recommended to keep false when using a dedicated tdarrNode deployment.
  internalNode: "false"

  extraEnv: []

  persistence:
    server:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      # Stores Tdarr database, job history, and plugin configs
      size: 5Gi
      existingClaim: ""
      annotations: {}

    media:
      enabled: true
      existingClaim: "shared-media"
      # Mounted at /media so the server can scan libraries and dispatch work to nodes

    # Shared transcode cache mounted at /temp on both the server and tdarrNode pods.
    # Must use ReadWriteMany so both pods can mount it simultaneously.
    # tdarrNode references this same PVC by default.
    cache:
      enabled: false
      storageClass: ""
      accessMode: ReadWriteMany
      size: 150Gi
      existingClaim: ""
      annotations: {}

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  startupProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  replicaCount: 1
  strategy:
    type: Recreate
  extraVolumes: []
  extraVolumeMounts: []

# Tdarr Node - Transcoding worker with Intel QSV/VAAPI and NVIDIA support
tdarrNode:
  enabled: false

  # Display name shown in the Tdarr UI for this worker node
  nodeName: "k8s-intel-node"

  # Port of the tdarr server to connect to (must match tdarr.service.serverPort)
  serverPort: "8266"

  image:
    repository: haveagitgat/tdarr_node
    tag: "2.74.01"
    pullPolicy: IfNotPresent

  # User/group IDs for file ownership (passed as PUID/PGID to the container)
  puid: "65534"
  pgid: "65534"

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: false
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault
    # GIDs required for /dev/dri device access:
    #   44  = video group (card* devices)
    #   109 = render group (renderD* devices)
    # Verify on your host node with: stat /dev/dri/renderD128
    supplementalGroups:
      - 44
      - 109

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  # Intel Quick Sync / VAAPI hardware acceleration
  # Kaby Lake supports H.264 encode/decode and H.265 encode/decode via VAAPI.
  hardwareAcceleration:
    intelVaapi:
      enabled: false
      # Device plugin resource to request. The Intel GPU Device Plugin DaemonSet must
      # be deployed in the cluster — it injects /dev/dri into the pod without a hostPath
      # volume, which is required for PodSecurity "baseline" compliance.
      # https://github.com/intel/intel-device-plugins-for-kubernetes
      resourceName: "gpu.intel.com/i915"
      resourceCount: 1
      # VA-API user-space driver name set as LIBVA_DRIVER_NAME inside the container.
      # The driver must exist inside the tdarr_node image, NOT on the host.
      # Leave empty to let libva auto-detect (safest default).
      # Common values:
      #   iHD  - intel-media-driver (Broadwell+, better H.265 encode/decode)
      #   i965 - intel-vaapi-driver (older driver, more commonly bundled in images)
      # Verify what's available: kubectl exec <tdarr-node-pod> -- vainfo
      libvaDriverName: ""
      # Pin this pod to nodes that have an Intel iGPU.
      # Label applied by NFD (intel.feature.node.kubernetes.io/gpu).
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      tolerations: []
      affinity: {}

    # NVIDIA NVENC/NVDEC (requires NVIDIA GPU Operator/device plugin)
    nvidia:
      enabled: false
      # Number of GPUs to request (typically 1)
      gpuLimit: 1
      # GPU resource name (default: nvidia.com/gpu)
      resourceName: nvidia.com/gpu
      # Runtime class name for the NVIDIA container runtime
      runtimeClassName: nvidia
      # Optional scheduling controls when NVIDIA is enabled (usually not required
      # because requesting GPU resources already pins to GPU nodes)
      nodeSelector: {}
      tolerations: []
      affinity: {}

  persistence:
    media:
      enabled: true
      existingClaim: "shared-media"
      # Mounted at /media inside the container; point Tdarr libraries here

    # Transcode cache mounted at /temp. Shares the PVC created by tdarr.persistence.cache
    # so the server can copy completed files after the node finishes transcoding.
    # Override existingClaim only if you need to point at a different PVC.
    cache:
      enabled: false
      existingClaim: ""

  resources:
    limits:
      cpu: 4000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: tdarr-node
          topologyKey: kubernetes.io/hostname
  podAnnotations: {}
  podLabels: {}
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ffmpeg-normalize - Nightly EBU R128 audio normalization across the media library
#
# Runs as a Kubernetes CronJob and walks configured media directories, normalizing
# audio loudness to the EBU R128 standard (-23 LUFS) using ffmpeg's loudnorm filter.
# Each file is normalized to a temp file in the same directory, then atomically
# replaced, so an interrupted run leaves no partially-written files.
#
# GPU note: NVENC/NVDEC are video-only hardware codecs. The loudnorm audio filter
# is pure CPU signal processing — no GPU acceleration exists for audio normalization.
#
# Audio re-encoding: loudnorm always re-encodes audio. The default codec is AAC
# (widely compatible). If your library uses AC3/DTS/Atmos, consider the quality
# trade-off, or set audioCodec to match your source format.
#
# Image: the default python:3.12-slim installs ffmpeg + ffmpeg-normalize at each
# run (~60s overhead). For faster startup, build a dedicated image:
#   FROM python:3.12-slim
#   RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg \
#       && pip install ffmpeg-normalize \
#       && rm -rf /var/lib/apt/lists/*
ffmpegNormalize:
  enabled: false

  # Cron schedule — default: 2:00 AM daily
  schedule: "0 2 * * *"

  # EBU R128 loudness targets
  targetI: "-23"    # integrated loudness (LUFS)
  targetTP: "-2"    # true peak (dBTP)
  targetLRA: "7"    # loudness range (LU)

  # Audio codec and bitrate for the re-encoded audio streams.
  # Common options: aac (default, widely compatible), ac3, libopus
  audioCodec: "aac"
  audioBitrate: "192k"

  # Media directories on the shared-media PVC to scan (space-separated)
  mediaPaths:
    - /media/movies
    - /media/tv

  # File extensions to process (space-separated string)
  extensions: "mkv mp4 avi m4v mov"

  # Set to true to run in analysis-only mode — reports loudness without modifying files
  dryRun: false

  image:
    repository: python
    tag: "3.14-slim"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault
    supplementalGroups: []

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  resources:
    limits:
      cpu: 4000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 256Mi

  # Maximum wall-clock time the job may run before Kubernetes terminates it.
  # 8 hours is generous for large libraries; tune down once you know your runtime.
  activeDeadlineSeconds: 28800

  # How long to keep finished job pods for log inspection before auto-deletion.
  ttlSecondsAfterFinished: 3600

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  extraVolumes: []
  extraVolumeMounts: []
