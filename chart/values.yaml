# Values for media-stack monolithic chart

# Global settings shared across all applications
global:
  timezone: "UTC"
  
  # URL paths for each application (used by both ingress and routes)
  paths:
    jellyfin: ""          # Root path
    prowlarr: "/prowlarr"
    sonarr: "/sonarr"
    radarr: "/radarr"
    sabnzbd: "/sabnzbd"
  
  # Single ingress configuration for all apps
  ingress:
    enabled: false
    className: ""
    hostname: "media.local"
    annotations: {}
    tls: []
  
  # OpenShift Route configuration (preferred for OKD)
  route:
    enabled: true
    hostname: "media.local"
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
    annotations:
      haproxy.router.openshift.io/timeout: "5m"

# Shared storage configuration
shared:
  media:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 500Gi
    annotations: {}
    # This PVC will be mounted by all apps with subdirectories:
    # /media/downloads - for SABnzbd downloads and Sonarr/Radarr processing
    # /media/tv - for TV shows (Sonarr -> Jellyfin)
    # /media/movies - for movies (Radarr -> Jellyfin)
    # /media/music - for music (Lidarr -> Jellyfin, if added later)
  
  # OpenShift/OKD Topology View customization
  topology:
    # Custom icons for each application in the topology view
    icons:
      jellyfin: "icon-mediaplayer"
      prowlarr: "icon-search"
      sonarr: "icon-tv"
      radarr: "icon-video"
      sabnzbd: "icon-download"
    # Show connections between apps in topology view
    showConnections: true

# Jellyfin - Media Server
jellyfin:
  enabled: true
  
  image:
    repository: jellyfin/jellyfin
    tag: "10.11.1"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  
  # Init container to create media subdirectories
  initContainer:
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    
  service:
    type: ClusterIP
    port: 8096
    targetPort: 8096
  
  persistence:
    config:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 2Gi
      existingClaim: ""
      annotations: {}

    media:
      enabled: true
      existingClaim: "shared-media"
      # Mounts the shared media PVC at /media

  resources:
    limits:
      cpu: 4000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  extraVolumes: []
  extraVolumeMounts: []

