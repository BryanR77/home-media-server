# SABnzbd - Download Client
sabnzbd:
  enabled: true
  
  image:
    repository: ghcr.io/home-operations/sabnzbd
    tag: "4.5.5"
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podSecurityContext:
    runAsNonRoot: true
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault
    supplementalGroups: []

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  # Hostname whitelist configuration for SABnzbd security
  hostnameWhitelist: ""
  
  persistence:
    config:
      enabled: true
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 1Gi
      existingClaim: ""
      
    media:
      enabled: true
      existingClaim: "shared-media"
      # Mounts the shared media PVC at /media
      # SABnzbd will download to /media/downloads

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /sabnzbd/api?mode=version
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /sabnzbd/api?mode=version
      port: http
      scheme: HTTP
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /sabnzbd/api?mode=version
      port: http
      scheme: HTTP
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 30

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  extraVolumes: []
  extraVolumeMounts: []

