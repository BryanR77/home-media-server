{{- if .Values.whisparr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "whisparr") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "whisparr") | nindent 4 }}
spec:
  replicas: {{ .Values.whisparr.replicaCount }}
  strategy:
    {{- toYaml .Values.whisparr.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "whisparr") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.whisparr.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "whisparr") | nindent 8 }}
        {{- with .Values.whisparr.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "whisparr") }}
      securityContext:
        {{- toYaml .Values.whisparr.podSecurityContext | nindent 8 }}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      {{- if .Values.whisparr.ingress.basePath }}
      initContainers:
        - name: config-setup
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              CONFIG_FILE="/config/config.xml"
              URLBASE="{{ trimPrefix "/" .Values.whisparr.ingress.basePath }}"
              
              # Create config directory if it doesn't exist
              mkdir -p /config
              
              # If config.xml doesn't exist, create a minimal one
              if [ ! -f "$CONFIG_FILE" ]; then
                cat > "$CONFIG_FILE" <<EOF
              <?xml version="1.0" encoding="utf-8"?>
              <Config>
                <UrlBase>$URLBASE</UrlBase>
              </Config>
              EOF
                echo "Created new config.xml with UrlBase=$URLBASE"
              else
                # Check if UrlBase exists and update/add it
                if grep -q "<UrlBase>" "$CONFIG_FILE"; then
                  # UrlBase exists, update it
                  sed -i "s|<UrlBase>.*</UrlBase>|<UrlBase>$URLBASE</UrlBase>|" "$CONFIG_FILE"
                  echo "Updated existing UrlBase to $URLBASE"
                else
                  # UrlBase doesn't exist, add it after <Config>
                  sed -i "s|<Config>|<Config>\n  <UrlBase>$URLBASE</UrlBase>|" "$CONFIG_FILE"
                  echo "Added UrlBase=$URLBASE to existing config"
                fi
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      {{- end }}
      containers:
        - name: whisparr
          securityContext:
            {{- toYaml .Values.whisparr.securityContext | nindent 12 }}
          image: "{{ .Values.whisparr.image.repository }}:{{ .Values.whisparr.image.tag }}"
          imagePullPolicy: {{ .Values.whisparr.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ include "media-stack.timezone" . | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.whisparr.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.whisparr.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.whisparr.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.whisparr.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.whisparr.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if .Values.whisparr.persistence.media.enabled }}
            - name: media
              mountPath: /media
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.whisparr.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "media-stack.appFullname" (dict "root" . "app" "whisparr") }}-config
        {{- if .Values.whisparr.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.whisparr.persistence.media.existingClaim }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.whisparr.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.whisparr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.whisparr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.whisparr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
