{{- if .Values.whisparr.enabled }}
{{- if .Values.whisparr.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "whisparr") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "whisparr") | nindent 4 }}
  {{- with .Values.whisparr.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
