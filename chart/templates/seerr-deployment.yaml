{{- if .Values.seerr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "seerr") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "seerr") | nindent 4 }}
spec:
  replicas: {{ .Values.seerr.replicaCount }}
  strategy:
    {{- toYaml .Values.seerr.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "seerr") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.seerr.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "seerr") | nindent 8 }}
        {{- with .Values.seerr.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "seerr") }}
      securityContext:
        {{- toYaml .Values.seerr.podSecurityContext | nindent 8 }}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: seerr
          securityContext:
            {{- toYaml .Values.seerr.securityContext | nindent 12 }}
          image: "{{ .Values.seerr.image.repository }}:{{ .Values.seerr.image.tag }}"
          imagePullPolicy: {{ .Values.seerr.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ include "media-stack.timezone" . | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.seerr.logLevel | quote }}
            - name: PORT
              value: {{ .Values.seerr.service.targetPort | quote }}
            {{- with .Values.seerr.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.seerr.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.seerr.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.seerr.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.seerr.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.seerr.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: tmp
              mountPath: /tmp
            {{- with .Values.seerr.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "media-stack.appFullname" (dict "root" . "app" "seerr") }}-config
        - name: tmp
          emptyDir: {}
        {{- with .Values.seerr.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.seerr.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seerr.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.seerr.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
