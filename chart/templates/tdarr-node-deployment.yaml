{{- if .Values.tdarrNode.enabled }}
{{- $nodeName := default (printf "%s-tdarr-node" (include "media-stack.fullname" .)) .Values.tdarrNode.serviceAccount.name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "media-stack.fullname" . }}-tdarr-node
  labels:
    {{- include "media-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: tdarr-node
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tdarr-node
spec:
  replicas: {{ .Values.tdarrNode.replicaCount }}
  strategy:
    {{- toYaml .Values.tdarrNode.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tdarr-node
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.tdarrNode.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: tdarr-node
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.tdarrNode.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ default (printf "%s-tdarr-node" (include "media-stack.fullname" .)) .Values.tdarrNode.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.tdarrNode.podSecurityContext | nindent 8 }}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: tdarr-node
          securityContext:
            {{- toYaml .Values.tdarrNode.securityContext | nindent 12 }}
          image: "{{ .Values.tdarrNode.image.repository }}:{{ .Values.tdarrNode.image.tag }}"
          imagePullPolicy: {{ .Values.tdarrNode.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ include "media-stack.timezone" . | quote }}
            - name: PUID
              value: {{ .Values.tdarrNode.puid | quote }}
            - name: PGID
              value: {{ .Values.tdarrNode.pgid | quote }}
            - name: serverIP
              value: {{ include "media-stack.appFullname" (dict "root" . "app" "tdarr") | quote }}
            - name: serverPort
              value: {{ .Values.tdarrNode.serverPort | quote }}
            - name: inContainer
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: nodeName
              value: "$(POD_NAME)"
            {{- if and .Values.tdarrNode.hardwareAcceleration.intelVaapi.enabled .Values.tdarrNode.hardwareAcceleration.intelVaapi.libvaDriverName }}
            - name: LIBVA_DRIVER_NAME
              value: {{ .Values.tdarrNode.hardwareAcceleration.intelVaapi.libvaDriverName | quote }}
            {{- end }}
            {{- with .Values.tdarrNode.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- with .Values.tdarrNode.resources }}
            limits:
              {{- toYaml .limits | nindent 14 }}
              {{- if and $.Values.tdarrNode.hardwareAcceleration.intelVaapi.enabled $.Values.tdarrNode.hardwareAcceleration.intelVaapi.resourceName }}
              {{ $.Values.tdarrNode.hardwareAcceleration.intelVaapi.resourceName }}: {{ $.Values.tdarrNode.hardwareAcceleration.intelVaapi.resourceCount | quote }}
              {{- end }}
            requests:
              {{- toYaml .requests | nindent 14 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.tdarrNode.persistence.media.enabled }}
            - name: media
              mountPath: /media
            {{- end }}
            - name: cache
              mountPath: /temp
            - name: tmp
              mountPath: /tmp
            {{- with .Values.tdarrNode.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.tdarrNode.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.tdarrNode.persistence.media.existingClaim }}
        {{- end }}
        - name: cache
          {{- if .Values.tdarrNode.persistence.cache.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-tdarr-node-cache" (include "media-stack.fullname" .)) .Values.tdarrNode.persistence.cache.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.tdarrNode.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $nodeSelector := .Values.tdarrNode.nodeSelector }}
      {{- $tolerations := .Values.tdarrNode.tolerations }}
      {{- $affinity := .Values.tdarrNode.affinity }}
      {{- if .Values.tdarrNode.hardwareAcceleration.intelVaapi.enabled }}
        {{- $nodeSelector = mergeOverwrite $nodeSelector .Values.tdarrNode.hardwareAcceleration.intelVaapi.nodeSelector }}
        {{- $tolerations = concat $tolerations .Values.tdarrNode.hardwareAcceleration.intelVaapi.tolerations }}
        {{- $affinity = mergeOverwrite $affinity .Values.tdarrNode.hardwareAcceleration.intelVaapi.affinity }}
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.tdarrNode.enabled .Values.tdarrNode.persistence.cache.enabled (not .Values.tdarrNode.persistence.cache.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "media-stack.fullname" . }}-tdarr-node-cache
  labels:
    {{- include "media-stack.labels" . | nindent 4 }}
    app.kubernetes.io/name: tdarr-node
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tdarr-node-cache
  {{- with .Values.tdarrNode.persistence.cache.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.tdarrNode.persistence.cache.accessMode }}
  {{- if .Values.tdarrNode.persistence.cache.storageClass }}
  {{- if (eq "-" .Values.tdarrNode.persistence.cache.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.tdarrNode.persistence.cache.storageClass }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tdarrNode.persistence.cache.size }}
{{- end }}
