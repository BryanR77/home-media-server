{{- if .Values.jellyfin.enabled }}
{{- if .Values.jellyfin.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "jellyfin") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "jellyfin") | nindent 4 }}
  {{- with .Values.jellyfin.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
