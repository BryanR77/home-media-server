{{- if .Values.jellyfin.enabled }}
{{- if .Values.jellyfin.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "jellyfin") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "jellyfin") | nindent 4 }}
  {{- with .Values.jellyfin.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.jellyfin.hardwareAcceleration.intelQuickSync.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}-scc-role
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "jellyfin") | nindent 4 }}
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}-quicksync
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}-scc-binding
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "jellyfin") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}-scc-role
subjects:
  - kind: ServiceAccount
    name: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "jellyfin") }}
{{- end }}
{{- end }}
