{{- if .Values.bazarr.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "bazarr") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "bazarr") | nindent 4 }}
  {{- with .Values.bazarr.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.bazarr.service.type }}
  ports:
    - port: {{ .Values.bazarr.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "bazarr") | nindent 4 }}
{{- end }}
