{{- if .Values.jellyfin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "jellyfin") | nindent 4 }}
  annotations:
    openshift.io/generated-by: "Helm"
    {{- if .Values.shared.topology.icons.jellyfin }}
    app.openshift.io/runtime: "jellyfin"
    app.openshift.io/runtime-icon: {{ .Values.shared.topology.icons.jellyfin | quote }}
    {{- end }}
    {{- if .Values.shared.topology.showConnections }}
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"{{ include "media-stack.appFullname" (dict "root" . "app" "sonarr") }}"}]'
    {{- end }}
spec:
  replicas: {{ .Values.jellyfin.replicaCount }}
  strategy:
    {{- toYaml .Values.jellyfin.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "jellyfin") | nindent 6 }}
  template:
    metadata:
      annotations:
        openshift.io/generated-by: "Helm"
        {{- with .Values.jellyfin.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "jellyfin") | nindent 8 }}
        {{- with .Values.jellyfin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "jellyfin") }}
      securityContext:
        {{- if .Values.jellyfin.hardwareAcceleration.intelQuickSync.enabled }}
        # Custom security context for Intel Quick Sync
        # Seccomp profile is omitted as it's not supported by custom SCCs
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
        # Add video group for /dev/dri access
        {{- if .Values.jellyfin.hardwareAcceleration.intelQuickSync.videoGroupId }}
        supplementalGroups:
          - {{ .Values.jellyfin.hardwareAcceleration.intelQuickSync.videoGroupId }}
        {{- end }}
        {{- else }}
        {{- toYaml .Values.jellyfin.podSecurityContext | nindent 8 }}
        {{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      {{- if .Values.jellyfin.persistence.media.enabled }}
      initContainers:
        - name: init-media-dirs
          image: "{{ .Values.jellyfin.initContainer.image.repository }}:{{ .Values.jellyfin.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.jellyfin.initContainer.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Creating media subdirectories if they don't exist..."
              mkdir -p /media/downloads /media/tv /media/movies /media/music
              echo "Directory structure created successfully"
              ls -la /media/
          securityContext:
            {{- toYaml .Values.jellyfin.initContainer.securityContext | nindent 12 }}
          volumeMounts:
            - name: media
              mountPath: /media
      {{- end }}
      containers:
        - name: jellyfin
          securityContext:
            {{- if .Values.jellyfin.hardwareAcceleration.intelQuickSync.enabled }}
            # Custom security context for Intel Quick Sync /dev/dri access
            # Uses custom SCC instead of privileged mode
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            {{- else }}
            {{- toYaml .Values.jellyfin.securityContext | nindent 12 }}
            {{- end }}
          image: "{{ .Values.jellyfin.image.repository }}:{{ .Values.jellyfin.image.tag }}"
          imagePullPolicy: {{ .Values.jellyfin.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ include "media-stack.timezone" . | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.jellyfin.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.jellyfin.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.jellyfin.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.jellyfin.startupProbe | nindent 12 }}
          resources:
            {{- if .Values.jellyfin.hardwareAcceleration.nvidia.enabled }}
            limits:
              {{ .Values.jellyfin.hardwareAcceleration.nvidia.resourceName }}: {{ .Values.jellyfin.hardwareAcceleration.nvidia.gpuLimit }}
              {{- with .Values.jellyfin.resources.limits }}
              {{- if .cpu }}
              cpu: {{ .cpu }}
              {{- end }}
              {{- if .memory }}
              memory: {{ .memory }}
              {{- end }}
              {{- end }}
            {{- with .Values.jellyfin.resources.requests }}
            requests:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- else }}
            {{- toYaml .Values.jellyfin.resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if .Values.jellyfin.persistence.media.enabled }}
            - name: media
              mountPath: /media
            {{- end }}
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            {{- if .Values.jellyfin.hardwareAcceleration.intelQuickSync.enabled }}
            - name: dri
              mountPath: {{ .Values.jellyfin.hardwareAcceleration.intelQuickSync.devicePath }}
            {{- end }}
            {{- with .Values.jellyfin.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}-config
        {{- if .Values.jellyfin.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.jellyfin.persistence.media.existingClaim }}
        {{- end }}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.jellyfin.hardwareAcceleration.intelQuickSync.enabled }}
        - name: dri
          hostPath:
            path: {{ .Values.jellyfin.hardwareAcceleration.intelQuickSync.devicePath }}
        {{- end }}
        {{- with .Values.jellyfin.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.jellyfin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jellyfin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jellyfin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
