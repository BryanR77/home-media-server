{{- if .Values.seerr.enabled }}
{{- if .Values.seerr.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "seerr") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "seerr") | nindent 4 }}
  {{- with .Values.seerr.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
