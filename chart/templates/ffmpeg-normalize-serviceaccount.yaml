{{- if .Values.ffmpegNormalize.enabled }}
{{- if .Values.ffmpegNormalize.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-ffmpeg-normalize" (include "media-stack.fullname" .)) .Values.ffmpegNormalize.serviceAccount.name }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "ffmpeg-normalize") | nindent 4 }}
  {{- with .Values.ffmpegNormalize.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
