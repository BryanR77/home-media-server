{{- if .Values.tdarr.enabled }}
{{- if .Values.tdarr.persistence.server.enabled }}
{{- if not .Values.tdarr.persistence.server.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "tdarr") }}-server
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "tdarr") | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.tdarr.persistence.server.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.tdarr.persistence.server.accessMode }}
  {{- if .Values.tdarr.persistence.server.storageClass }}
  {{- if (eq "-" .Values.tdarr.persistence.server.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.tdarr.persistence.server.storageClass }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tdarr.persistence.server.size }}
{{- end }}
{{- end }}
{{- if .Values.tdarr.persistence.cache.enabled }}
{{- if not .Values.tdarr.persistence.cache.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "tdarr") }}-cache
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "tdarr") | nindent 4 }}
    app.kubernetes.io/component: cache
  {{- with .Values.tdarr.persistence.cache.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.tdarr.persistence.cache.accessMode }}
  {{- if .Values.tdarr.persistence.cache.storageClass }}
  {{- if (eq "-" .Values.tdarr.persistence.cache.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.tdarr.persistence.cache.storageClass }}
  {{- end }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tdarr.persistence.cache.size }}
{{- end }}
{{- end }}
{{- end }}
