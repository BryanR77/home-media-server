{{- if .Values.bazarr.enabled }}
{{- if .Values.bazarr.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "media-stack.serviceAccountName" (dict "root" . "app" "bazarr") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "bazarr") | nindent 4 }}
  {{- with .Values.bazarr.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
