{{- if .Values.global.httpRoute.enabled }}
{{- if .Values.jellyfin.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "jellyfin") | nindent 4 }}
  {{- with .Values.global.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.global.httpRoute.parentRef.name }}
      namespace: {{ .Values.global.httpRoute.parentRef.namespace }}
  hostnames:
    - "{{ .Values.jellyfin.ingress.subdomain }}.{{ .Values.global.baseDomain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}
          port: {{ .Values.jellyfin.service.port }}
{{- end }}
