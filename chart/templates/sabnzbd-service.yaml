{{- if .Values.sabnzbd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "media-stack.appFullname" (dict "root" . "app" "sabnzbd") }}
  labels:
    {{- include "media-stack.appLabels" (dict "root" . "app" "sabnzbd") | nindent 4 }}
spec:
  type: {{ .Values.sabnzbd.service.type }}
  ports:
    - port: {{ .Values.sabnzbd.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "media-stack.appSelectorLabels" (dict "root" . "app" "sabnzbd") | nindent 4 }}
{{- end }}
