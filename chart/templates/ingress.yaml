{{- if .Values.global.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "media-stack.fullname" . }}
  labels:
    {{- include "media-stack.labels" . | nindent 4 }}
  {{- with .Values.global.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.global.ingress.className }}
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- end }}
  {{- if .Values.global.ingress.tls }}
  tls:
    {{- toYaml .Values.global.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.global.ingress.hostname }}
      http:
        paths:
          {{- if .Values.jellyfin.enabled }}
          - path: {{ .Values.global.paths.jellyfin | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "media-stack.appFullname" (dict "root" . "app" "jellyfin") }}
                port:
                  number: {{ .Values.jellyfin.service.port }}
          {{- end }}
          {{- if .Values.prowlarr.enabled }}
          - path: {{ .Values.global.paths.prowlarr }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "media-stack.appFullname" (dict "root" . "app" "prowlarr") }}
                port:
                  number: {{ .Values.prowlarr.service.port }}
          {{- end }}
          {{- if .Values.sonarr.enabled }}
          - path: {{ .Values.global.paths.sonarr }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "media-stack.appFullname" (dict "root" . "app" "sonarr") }}
                port:
                  number: {{ .Values.sonarr.service.port }}
          {{- end }}
          {{- if .Values.sabnzbd.enabled }}
          - path: {{ .Values.global.paths.sabnzbd }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "media-stack.appFullname" (dict "root" . "app" "sabnzbd") }}
                port:
                  number: {{ .Values.sabnzbd.service.port }}
          {{- end }}
{{- end }}
